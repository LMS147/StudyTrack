name: Android CI

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "platforms:"; ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "build-tools:"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Gradle wrapper scripts exist
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-output.log
          status=$?
          if [ $status -ne 0 ]; then
            tail -n 40 build-output.log | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g' | head -c 3800 > /tmp/msg.txt || true
            echo "::error::Gradle build failed. Log tail:%0A$(cat /tmp/msg.txt)"
          fi
          exit $status

      - name: Report failure context
        if: failure()
        run: |
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            java -version 2>&1
            echo "platforms:"; ls "$ANDROID_HOME/platforms" 2>/dev/null
          } > /tmp/ctx.txt || true
          sed 's/%/%25/g' /tmp/ctx.txt | tr '\n' '\r' | sed 's/\r/%0A/g' | head -c 3000 > /tmp/ctxmsg.txt || true
          echo "::error::Failure context:%0A$(cat /tmp/ctxmsg.txt)"

      # One-time: CI generates the wrapper scripts + jar and commits them back,
      # so the repo is fully buildable with ./gradlew locally afterwards.
      - name: Commit Gradle wrapper (first successful build only)
        if: success() && github.ref == 'refs/heads/arena/01a0b968-studytrack'
        run: |
          CHANGED=$(git status --porcelain gradlew gradlew.bat gradle)
          if [ -n "$CHANGED" ]; then
            git config user.name "studytrack-ci"
            git config user.email "ci@studytrack.local"
            git add gradlew gradlew.bat gradle
            git commit -m "chore: generate Gradle wrapper from CI"
            git push
            echo "Wrapper committed."
          else
            echo "Wrapper already present, nothing to commit."
          fi
