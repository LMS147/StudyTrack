# Project-wide Gradle settings.

# Gradle daemon heap.
#
# Raised from -Xmx2048m when KSP (the Room annotation processor) was added.
# KSP runs inside the Kotlin compile daemon alongside the Kotlin compiler, and
# 2 GB was tight enough for the daemon to fail on startup — which surfaces as
# "Could not connect to Kotlin compile daemon", an error that reads like a
# networking problem but is usually the daemon process dying before it can
# accept a connection.
#
# Metaspace is capped explicitly because AGP + KSP load a lot of classes and the
# JVM's default grows without bound until the machine runs out.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Heap for the Kotlin compile daemon, set separately from Gradle's own. Without
# this the daemon inherits org.gradle.jvmargs, so the two compete for the same
# budget on a machine that is also running Android Studio.
kotlin.daemon.jvmargs=-Xmx1792m -XX:MaxMetaspaceSize=512m

# AndroidX package structure.
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official
# Only keep the module's own resources in its R class.
android.nonTransitiveRClass=true
