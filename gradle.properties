# Project-wide Gradle settings.

# ---------------------------------------------------------------------------
# Kotlin compilation strategy: in-process, not the daemon.
#
# This is deliberate, and it costs build speed to buy reliability.
#
# Kotlin normally compiles in a separate long-lived daemon that Gradle talks to
# over a local RMI socket. When that handshake fails, the build dies with:
#
#   Could not connect to Kotlin compile daemon
#
# The message reads like a networking problem, but the causes are local and
# varied — the daemon process failing to start, a stale daemon from an earlier
# crashed build, an IPv4/IPv6 mismatch on `localhost`, or antivirus/firewall
# blocking the loopback port. Diagnosing which one applies needs the failing
# machine, and the same project builds fine elsewhere, so it is a poor thing to
# make every contributor debug.
#
# `in-process` runs the Kotlin compiler inside the Gradle daemon instead. There
# is no second process and no socket, so the whole failure class disappears.
# The cost is a slower build and no reuse of compiler state between builds.
#
# If your builds are reliable and you want the speed back, override this in your
# machine-local ~/.gradle/gradle.properties (never commit it):
#
#   kotlin.compiler.execution.strategy=daemon
#
# ---------------------------------------------------------------------------
kotlin.compiler.execution.strategy=in-process

# Gradle daemon heap.
#
# Raised from -Xmx2048m when KSP (the Room annotation processor) was added, and
# now it also has to host the Kotlin compiler itself because of the in-process
# strategy above. Metaspace is capped explicitly: AGP + KSP + kotlinc load a
# great many classes, and the JVM default grows without bound.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Note: kotlin.daemon.jvmargs is intentionally NOT set. It only applies to the
# daemon strategy, and with in-process there is no separate daemon to size —
# leaving a stale value here would just mislead the next person reading it.

# AndroidX package structure.
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official
# Only keep the module's own resources in its R class.
android.nonTransitiveRClass=true
